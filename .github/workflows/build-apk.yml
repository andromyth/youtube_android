name: Build TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --no-progress

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradlew') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        working-directory: android
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ORG_GRADLE_PROJECT_android.enableShrinkResourcesInReleaseBuilds: 'false'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --build-cache \
            -PreactNativeArchitectures=armeabi-v7a

      - name: List APKs
        run: |
          echo "APKs found:"
          find android/app/build -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: android/app/build/**/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tv-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/release/*.apk \
            --title "TV build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build from ${GITHUB_SHA}."

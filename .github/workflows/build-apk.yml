name: Build TV APK

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.test.*'
      - 'tests/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.test.*'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --filter videoapp --no-progress

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle and restore build cache
        uses: gradle/actions/setup-gradle@v4

      # PRs validate the exact React Native release bundle task first. The
      # full native APK build runs on main (or manual dispatch), avoiding a
      # 15+ minute native build for a JavaScript/Metro dependency failure.
      - name: Validate release JavaScript bundle
        if: github.event_name == 'pull_request'
        working-directory: android
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          chmod +x gradlew
          ./gradlew :app:createBundleFossReleaseJsAndAssets --no-daemon --stacktrace --build-cache --parallel \
            -PreactNativeArchitectures=armeabi-v7a

      - name: Build release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ORG_GRADLE_PROJECT_android.enableShrinkResourcesInReleaseBuilds: 'false'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --build-cache --parallel \
            -PreactNativeArchitectures=armeabi-v7a

      - name: List APKs
        run: |
          echo "APKs found:"
          find android/app/build -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: android/app/build/**/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tv-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/release/*.apk \
            --title "TV build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build from ${GITHUB_SHA}."

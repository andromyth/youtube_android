name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install --filter videoapp --no-progress

      - name: test
        run: bun test

  android-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle and restore build cache
        uses: gradle/actions/setup-gradle@v4

      - uses: oven-sh/setup-bun@v2

      - name: install and prebuild
        run: |
          bun install --filter videoapp --no-progress
          bun expo prebuild -p android --clean --no-install

      - name: test Android module
        run: ./gradlew :video-app-view:testFullDebugUnitTest :video-app-view:testFossDebugUnitTest --build-cache --parallel
        working-directory: android
